name: monitoreo

on:
  schedule:
    - cron: "17 12 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitoreo
  cancel-in-progress: true

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python monitoreo/src/actualizar.py
      - run: python monitoreo/src/a_catalogo.py
      - run: python monitoreo/src/exportar_snapshot.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/live datos/indice.json datos/catalogo.json datos/web_extra.json \
                  catalogo/data.json catalogo/prensa.json catalogo/meta.json \
                  datos_publicos/menciones.json
          git diff --cached --quiet || git commit -m "menciones $(date -u +%Y-%m-%d)"
          git push
