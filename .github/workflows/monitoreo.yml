name: monitoreo

on:
  schedule:
    - cron: "17 12 * * *"
    - cron: "17 21 * * *"
    - cron: "50 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitoreo
  cancel-in-progress: true

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CORRER_NOTICIAS: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '50 4 * * *') && '1' || '0' }}
      NOTICIAS_SIN_GDELT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python monitoreo/src/actualizar.py
      - run: python monitoreo/src/exportar_snapshot.py
      - name: Snapshot noticias
        if: env.CORRER_NOTICIAS == '1'
        run: python monitoreo/src/exportar_noticias.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/live datos/indice.json datos_publicos/menciones.json \
                  datos/noticias datos_publicos/noticias_inseguridad.json \
                  datos_publicos/noticias_servicios.json
          git diff --cached --quiet || git commit -m "menciones y noticias $(date -u +%Y-%m-%d)"
          git push
