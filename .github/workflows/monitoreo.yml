name: monitoreo

on:
  schedule:
    - cron: "17 12 * * *"   # 07:17 Lima — solo menciones
    - cron: "17 15 * * *"   # 10:17 Lima — solo noticias (llena «Hoy»)
    - cron: "17 21 * * *"   # 16:17 Lima — menciones + noticias
    - cron: "50 4 * * *"    # 23:50 Lima — cierre del día
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitoreo
  cancel-in-progress: true

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CORRER_NOTICIAS: ${{ (github.event_name != 'schedule' || contains(fromJSON('["17 15 * * *","17 21 * * *","50 4 * * *"]'), github.event.schedule)) && '1' || '0' }}
      SOLO_NOTICIAS: ${{ github.event.schedule == '17 15 * * *' && '1' || '0' }}
      NOTICIAS_SIN_GDELT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python monitoreo/src/actualizar.py
      - name: Snapshot menciones
        if: env.SOLO_NOTICIAS != '1'
        run: python monitoreo/src/exportar_snapshot.py
      - name: Snapshot noticias
        if: env.CORRER_NOTICIAS == '1'
        run: python monitoreo/src/exportar_noticias.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/live datos/indice.json datos_publicos/menciones.json \
                  datos/noticias datos_publicos/noticias_inseguridad.json \
                  datos_publicos/noticias_servicios.json
          git diff --cached --quiet || git commit -m "menciones y noticias $(date -u +%Y-%m-%d)"
          git push
